name: pivpn

services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: pivpn-adguard
    restart: unless-stopped
    labels: [autoheal=true]
    volumes:
      - ./data/adguard/work:/opt/adguardhome/work
      - ./data/adguard/conf:/opt/adguardhome/conf
    # Веб-панель тільки з самої малинки (127.0.0.1) і з VPN (10.8.1.2:3000)
    ports:
      - "127.0.0.1:${UI_PORT:-3000}:3000/tcp"
    healthcheck:
      test: ["CMD-SHELL", "nslookup -timeout=3 example.com 127.0.0.1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      vpn:
        ipv4_address: 10.8.1.2

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: pivpn-wireguard
    restart: unless-stopped
    labels: [autoheal=true]
    depends_on:
      adguard:
        condition: service_healthy
    cap_add: [NET_ADMIN]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Europe/Kyiv}
      SERVERURL: ${SERVER_HOST}
      SERVERPORT: ${WG_PORT:-51820}
      PEERS: ${PEERS:-phone}
      PEERDNS: 10.8.1.2
      INTERNAL_SUBNET: 10.13.13.0
      ALLOWEDIPS: "0.0.0.0/0, ::/0"
      PERSISTENTKEEPALIVE_PEERS: all
      LOG_CONFS: "false"
    volumes:
      - ./data/wireguard:/config
    ports:
      - "${WG_PORT:-51820}:51820/udp"
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
    healthcheck:
      test: ["CMD-SHELL", "wg show wg0 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      vpn:
        ipv4_address: 10.8.1.3

  # API для додатку: вмикання/вимикання блоклістів (доступний лише зсередини VPN)
  filterctl:
    image: python:3.12-alpine
    container_name: pivpn-filterctl
    restart: unless-stopped
    depends_on:
      adguard:
        condition: service_healthy
    command: ["python", "-u", "/app/filterctl.py"]
    volumes:
      - ./filterctl/filterctl.py:/app/filterctl.py:ro
      - ./adguard-password.txt:/run/adguard-password.txt:ro
    networks:
      vpn:
        ipv4_address: 10.8.1.4

  # Перезапускає контейнери, які стали unhealthy
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: pivpn-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  vpn:
    driver: bridge
    ipam:
      config:
        - subnet: 10.8.1.0/24
